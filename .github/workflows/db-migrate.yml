name: Database migration (manual)

# Applies the Prisma schema to a Cloud SQL database.
#
# Manual trigger only. This changes a real database and `prisma db push` runs
# with --accept-data-loss inside the image, so a human decides when it runs.
#
# The database has no public IP. Reaching it needs three things in order:
#   1. Google credentials, via GitHub OIDC (no stored password)
#   2. Tailscale, to get onto the network where the private IP is routable
#   3. cloud-sql-proxy, which listens on localhost and forwards to Cloud SQL
on:
  workflow_dispatch:
    inputs:
      database:
        description: Target database
        type: choice
        options:
          - testplanit_migration_test
        required: true

permissions:
  contents: read
  id-token: write # required for OIDC; auth fails with no useful error without it

env:
  INSTANCE: codimite-internal-app-dbs:us-central1:internal-apps-production-db
  PROXY_PORT: "3307"
  # Cloud SQL IAM username: the service account email MINUS ".gserviceaccount.com"
  DB_USER: testplanit-migration-sa-5ec6f@codimite-int-testplanit-prod.iam

jobs:
  migrate:
    name: Apply schema to ${{ inputs.database }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/194863077587/locations/global/workloadIdentityPools/gh-testplanit-migration-pool/providers/gh-testplanit-migration-provider
          service_account: testplanit-migration-sa-5ec6f@codimite-int-testplanit-prod.iam.gserviceaccount.com
          # Makes steps.auth.outputs.access_token available to the proxy below.
          token_format: access_token

      - name: Join Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:rnd-platform-gh-runner

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Start Cloud SQL Proxy
        run: |
          curl -sSLo cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

          # --private-ip: the instance has no public address.
          # --auto-iam-authn: authenticate as the service account, no password.
          ./cloud-sql-proxy "${INSTANCE}" \
            --port="${PROXY_PORT}" --private-ip --auto-iam-authn \
            --token="${{ steps.auth.outputs.access_token }}" \
            --quota-project=codimite-internal-app-dbs > proxy.log 2>&1 &

          for _ in {1..30}; do
            if grep -q "The proxy has started successfully" proxy.log; then
              echo "Proxy ready on 127.0.0.1:${PROXY_PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Cloud SQL Proxy did not become ready in 30s"
          cat proxy.log
          exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          cd testplanit
          pnpm install --frozen-lockfile --ignore-scripts

      # Check WHO we are before changing anything. `role` must be the admin
      # role, not the service account. Terraform runs
      # `ALTER ROLE ... SET role TO testplanit_mig_test_admin` on this account so
      # that everything it creates is owned by the shared admin role. If `role`
      # shows the service account instead, tables get the wrong owner and the
      # app later fails with "permission denied for table".
      - name: Confirm the database session
        run: |
          psql "host=127.0.0.1 port=${PROXY_PORT} dbname=${{ inputs.database }} user=${DB_USER} sslmode=disable" \
            -c "SELECT current_user, current_setting('role'), current_setting('search_path');"

      # These four run together on purpose.
      #
      # `prisma db push` SILENTLY DROPS the tpl_audit_* triggers
      # (see scripts/apply-triggers.ts:5-9), so apply-triggers.ts must always
      # follow it. A push without the re-apply loses audit capture with NO error.
      #
      # zenstack generate comes first because prisma/schema.prisma is generated
      # from schema.zmodel -- never assume the committed copy is current.
      #
      # sslmode=disable is correct: the connection is to the local proxy, and the
      # proxy terminates TLS to Cloud SQL.
      - name: Apply the schema
        env:
          DATABASE_URL: postgresql://testplanit-migration-sa-5ec6f%40codimite-int-testplanit-prod.iam@127.0.0.1:3307/${{ inputs.database }}?sslmode=disable
        run: |
          cd testplanit
          pnpm zenstack generate
          pnpm prisma db push --skip-generate
          pnpm tsx scripts/apply-triggers.ts
          pnpm tsx prisma/setup-extensions.ts

      - name: Verify
        run: |
          psql "host=127.0.0.1 port=${PROXY_PORT} dbname=${{ inputs.database }} user=${DB_USER} sslmode=disable" \
            -c "SELECT count(*) AS tables FROM information_schema.tables WHERE table_schema='public';" \
            -c "SELECT count(*) AS audit_triggers FROM information_schema.triggers WHERE trigger_name LIKE 'tpl_audit_%';" \
            -c "SELECT extname FROM pg_extension ORDER BY extname;"